<!DOCTYPE html>
<html>
<head>
    <title>Global Empire</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #topbar {
            height: 70px;
            background: #101c2d;
            display: flex;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
            border-bottom: 3px solid #243b55;
        }

        #title {
            font-size: 30px;
            font-weight: bold;
            margin-right: 60px;
        }

        #cash {
            font-size: 22px;
            color: #54e85a;
        }

        #map {
            width: 100vw;
            height: calc(100vh - 70px);
        }

        .country {
            stroke: #17202b;
            stroke-width: 0.7;
            cursor: pointer;
            transition: 0.15s;
        }

        .country:hover {
            stroke: white;
            stroke-width: 1.8;
            filter: brightness(1.25);
        }

        .owned {
            fill: #54e85a !important;
            stroke: #ffffff;
            stroke-width: 1.5;
        }

        #countryInfo {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 280px;
            background: #101c2d;
            border: 2px solid #39516e;
            border-radius: 12px;
            padding: 20px;
            display: none;
            box-shadow: 0 5px 20px #000;
        }

        #countryName {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stat {
            margin: 8px 0;
        }

        .bar {
            height: 8px;
            background: #29384b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }

        .fill {
            height: 100%;
            background: #54e85a;
        }

        #expandButton {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #54e85a;
            font-weight: bold;
            cursor: pointer;
        }

        #expandButton:hover {
            background: #7aff80;
        }

        #expandButton:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        #instruction {
            position: absolute;
            left: 20px;
            bottom: 20px;
            background: #101c2d;
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid #39516e;
        }
    </style>
</head>

<body>

    <div id="topbar">

        <div id="title">
            🌍 GLOBAL EMPIRE
        </div>

        <div id="cash">
            💰 $<span id="cashAmount">10,000</span>
        </div>

    </div>

    <svg id="map"></svg>

    <div id="instruction">
        Click a country to select it
    </div>

    <div id="countryInfo">

        <div id="countryName">
            Country
        </div>

        <div class="stat">
            👥 Population:
            <span id="population">-</span>
        </div>

        <div class="stat">
            💰 Market Size
            <div class="bar">
                <div id="marketBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            📈 Demand
            <div class="bar">
                <div id="demandBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            🚨 Police Pressure
            <div class="bar">
                <div id="policeBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            💵 Expansion Cost:
            $<span id="cost">-</span>
        </div>

        <button id="expandButton" onclick="expandCountry()">
            EXPAND INTO COUNTRY
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

    <script>

        let cash = 10000;

        let selectedCountry = null;

        let selectedElement = null;

        const ownedCountries = new Set();


        const countryData = {

            "South Africa": {
                population: "62M",
                market: 65,
                demand: 75,
                police: 35,
                cost: 5000
            },

            "United States": {
                population: "335M",
                market: 95,
                demand: 90,
                police: 75,
                cost: 25000
            },

            "Brazil": {
                population: "216M",
                market: 85,
                demand: 85,
                police: 50,
                cost: 15000
            },

            "India": {
                population: "1.4B",
                market: 95,
                demand: 95,
                police: 60,
                cost: 20000
            },

            "China": {
                population: "1.4B",
                market: 95,
                demand: 80,
                police: 85,
                cost: 30000
            },

            "United Kingdom": {
                population: "68M",
                market: 80,
                demand: 75,
                police: 80,
                cost: 18000
            },

            "Japan": {
                population: "124M",
                market: 85,
                demand: 70,
                police: 75,
                cost: 22000
            }

        };


        const svg = d3.select("#map");

        const width = window.innerWidth;

        const height = window.innerHeight - 70;

        svg
            .attr("width", width)
            .attr("height", height);


        const projection = d3.geoNaturalEarth1()
            .fitSize(
                [width - 40, height - 40],
                { type: "Sphere" }
            );


        const path = d3.geoPath()
            .projection(projection);


        d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
        ).then(function(world) {

            const countries =
                topojson.feature(
                    world,
                    world.objects.countries
                );


            svg.append("rect")
                .attr("width", width)
                .attr("height", height)
                .attr("fill", "#0877b9");


            svg.selectAll(".country")
                .data(countries.features)
                .enter()
                .append("path")
                .attr("class", "country")
                .attr("d", path)
                .attr("fill", function(d, i) {

                    const colours = [
                        "#55a630",
                        "#80b918",
                        "#ffca3a",
                        "#ff924c",
                        "#ff595e",
                        "#1982c4",
                        "#6a4c93"
                    ];

                    return colours[i % colours.length];

                })
                .on("click", function(event, d) {

                    selectCountry(
                        d.properties.name,
                        this
                    );

                });

        });


        function selectCountry(country, element) {

            selectedCountry = country;

            selectedElement = element;


            document.getElementById(
                "countryName"
            ).innerText = country;


            document.getElementById(
                "countryInfo"
            ).style.display = "block";


            const data = countryData[country];


            if (data) {

                document.getElementById(
                    "population"
                ).innerText = data.population;

                document.getElementById(
                    "marketBar"
                ).style.width =
                    data.market + "%";

                document.getElementById(
                    "demandBar"
                ).style.width =
                    data.demand + "%";

                document.getElementById(
                    "policeBar"
                ).style.width =
                    data.police + "%";

                document.getElementById(
                    "cost"
                ).innerText =
                    data.cost.toLocaleString();

            } else {

                document.getElementById(
                    "population"
                ).innerText = "Unknown";

                document.getElementById(
                    "marketBar"
                ).style.width = "50%";

                document.getElementById(
                    "demandBar"
                ).style.width = "50%";

                document.getElementById(
                    "policeBar"
                ).style.width = "50%";

                document.getElementById(
                    "cost"
                ).innerText = "10,000";

            }


            const button =
                document.getElementById(
                    "expandButton"
                );


            if (ownedCountries.has(country)) {

                button.innerText = "ALREADY CONTROLLED";

                button.disabled = true;

            } else {

                button.innerText =
                    "EXPAND INTO COUNTRY";

                button.disabled = false;

            }

        }


        function expandCountry() {

            if (!selectedCountry) {
                return;
            }


            if (ownedCountries.has(selectedCountry)) {
                return;
            }


            const data =
                countryData[selectedCountry];


            const cost =
                data ? data.cost : 10000;


            if (cash < cost) {

                alert(
                    "Not enough cash!"
                );

                return;

            }


            cash -= cost;


            ownedCountries.add(
                selectedCountry
            );


            if (selectedElement) {

                selectedElement.classList.add(
                    "owned"
                );

            }


            document.getElementById(
                "cashAmount"
            ).innerText =
                cash.toLocaleString();


            const button =
                document.getElementById(
                    "expandButton"
                );


            button.innerText =
                "CONTROLLED";

            button.disabled = true;

        }

    </script>

</body>
</html>
