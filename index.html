<!DOCTYPE html>
<html>
<head>
    <title>Global Empire</title>

    <style>
        body {
            margin: 0;
            background: #07111f;
            color: white;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }

        #topbar {
            height: 70px;
            background: #101c2d;
            display: flex;
            align-items: center;
            padding: 0 25px;
            box-sizing: border-box;
            border-bottom: 3px solid #243b55;
        }

        #title {
            font-size: 30px;
            font-weight: bold;
            margin-right: 60px;
        }

        #cash {
            font-size: 22px;
            color: #54e85a;
            margin-right: 40px;
        }

        #day {
            font-size: 22px;
            color: #ffd166;
        }

        #map {
            width: 100vw;
            height: calc(100vh - 70px);
        }

        .country {
            stroke: #17202b;
            stroke-width: 0.7;
            cursor: pointer;
            transition: 0.15s;
        }

        .country:hover {
            stroke: white;
            stroke-width: 1.8;
            filter: brightness(1.25);
        }

        .owned {
            fill: #54e85a !important;
            stroke: white;
            stroke-width: 1.5;
        }

        #countryInfo {
            position: absolute;
            right: 20px;
            bottom: 20px;
            width: 300px;
            background: #101c2d;
            border: 2px solid #39516e;
            border-radius: 12px;
            padding: 20px;
            display: none;
            box-shadow: 0 5px 20px #000;
        }

        #countryName {
            font-size: 26px;
            font-weight: bold;
            margin-bottom: 15px;
        }

        .stat {
            margin: 8px 0;
        }

        .bar {
            height: 8px;
            background: #29384b;
            border-radius: 5px;
            overflow: hidden;
            margin-top: 4px;
        }

        .fill {
            height: 100%;
            background: #54e85a;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #54e85a;
            color: #07111f;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #7aff80;
        }

        button:disabled {
            background: #555;
            color: #aaa;
            cursor: not-allowed;
        }

        #instruction {
            position: absolute;
            left: 20px;
            bottom: 20px;
            background: #101c2d;
            padding: 12px 18px;
            border-radius: 10px;
            border: 2px solid #39516e;
        }

        #startMessage {
            color: #ffd166;
            font-weight: bold;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>

    <div id="topbar">

        <div id="title">
            🌍 GLOBAL EMPIRE
        </div>

        <div id="cash">
            💰 $<span id="cashAmount">10,000</span>
        </div>

        <div id="day">
            📅 DAY <span id="dayNumber">1</span>
        </div>

    </div>

    <svg id="map"></svg>

    <div id="instruction">
        🌍 Click a country to choose where your empire begins
    </div>

    <div id="countryInfo">

        <div id="countryName">
            Country
        </div>

        <div id="startMessage">
            Choose this country as your starting location.
        </div>

        <div class="stat">
            👥 Population:
            <span id="population">-</span>
        </div>

        <div class="stat">
            💰 Market Size
            <div class="bar">
                <div id="marketBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            📈 Demand
            <div class="bar">
                <div id="demandBar" class="fill"></div>
            </div>
        </div>

        <div class="stat">
            🚨 Police Pressure
            <div class="bar">
                <div id="policeBar" class="fill"></div>
            </div>
        </div>

        <button id="startButton" onclick="startEmpire()">
            START EMPIRE HERE
        </button>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <script src="https://cdn.jsdelivr.net/npm/topojson-client@3"></script>

    <script>

        let cash = 10000;

        let selectedCountry = null;

        let selectedElement = null;

        let gameStarted = false;

        let startingCountry = null;

        let day = 1;

        const ownedCountries = new Set();


        const countryData = {

            "South Africa": {
                population: "62M",
                market: 65,
                demand: 75,
                police: 35
            },

            "United States": {
                population: "335M",
                market: 95,
                demand: 90,
                police: 75
            },

            "Brazil": {
                population: "216M",
                market: 85,
                demand: 85,
                police: 50
            },

            "India": {
                population: "1.4B",
                market: 95,
                demand: 95,
                police: 60
            },

            "China": {
                population: "1.4B",
                market: 95,
                demand: 80,
                police: 85
            },

            "United Kingdom": {
                population: "68M",
                market: 80,
                demand: 75,
                police: 80
            },

            "Japan": {
                population: "124M",
                market: 85,
                demand: 70,
                police: 75
            }

        };


        /*
            LOAD SAVED GAME
        */

        const savedGame =
            localStorage.getItem("globalEmpireSave");

        if (savedGame) {

            const save =
                JSON.parse(savedGame);

            cash = save.cash ?? 10000;

            gameStarted =
                save.gameStarted ?? false;

            startingCountry =
                save.startingCountry ?? null;

            day =
                save.day ?? 1;

            if (save.ownedCountries) {

                save.ownedCountries.forEach(
                    country => ownedCountries.add(country)
                );

            }

        }


        /*
            UPDATE THE SCREEN
        */

        function updateTopBar() {

            document.getElementById(
                "cashAmount"
            ).innerText =
                cash.toLocaleString();

            document.getElementById(
                "dayNumber"
            ).innerText =
                day;

        }


        /*
            SAVE GAME
        */

        function saveGame() {

            const save = {

                cash: cash,

                gameStarted: gameStarted,

                startingCountry: startingCountry,

                day: day,

                ownedCountries:
                    Array.from(ownedCountries)

            };

            localStorage.setItem(
                "globalEmpireSave",
                JSON.stringify(save)
            );

        }


        updateTopBar();


        /*
            GAME CLOCK

            One real minute =
            one game day.
        */

        setInterval(function() {

            if (!gameStarted) {
                return;
            }

            day++;

            updateTopBar();

            saveGame();

        }, 60000);


        const svg = d3.select("#map");

        const width = window.innerWidth;

        const height =
            window.innerHeight - 70;

        svg
            .attr("width", width)
            .attr("height", height);


        const projection =
            d3.geoNaturalEarth1()
            .fitSize(
                [width - 40, height - 40],
                { type: "Sphere" }
            );


        const path =
            d3.geoPath()
            .projection(projection);


        d3.json(
            "https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"
        ).then(function(world) {

            const countries =
                topojson.feature(
                    world,
                    world.objects.countries
                );


            svg.append("rect")
                .attr("width", width)
                .attr("height", height)
                .attr("fill", "#0877b9");


            svg.selectAll(".country")
                .data(countries.features)
                .enter()
                .append("path")
                .attr("class", function(d) {

                    let classes = "country";

                    if (
                        ownedCountries.has(
                            d.properties.name
                        )
                    ) {
                        classes += " owned";
                    }

                    return classes;

                })
                .attr("d", path)
                .attr("fill", function(d, i) {

                    const colours = [
                        "#55a630",
                        "#80b918",
                        "#ffca3a",
                        "#ff924c",
                        "#ff595e",
                        "#1982c4",
                        "#6a4c93"
                    ];

                    return colours[i % colours.length];

                })
                .on("click", function(event, d) {

                    selectCountry(
                        d.properties.name,
                        this
                    );

                });


            if (gameStarted) {

                document.getElementById(
                    "instruction"
                ).innerText =
                    "🌍 Your empire is active.";

            }

        });


        function selectCountry(
            country,
            element
        ) {

            selectedCountry = country;

            selectedElement = element;


            document.getElementById(
                "countryName"
            ).innerText =
                country;


            document.getElementById(
                "countryInfo"
            ).style.display =
                "block";


            const data =
                countryData[country];


            if (data) {

                document.getElementById(
                    "population"
                ).innerText =
                    data.population;

                document.getElementById(
                    "marketBar"
                ).style.width =
                    data.market + "%";

                document.getElementById(
                    "demandBar"
                ).style.width =
                    data.demand + "%";

                document.getElementById(
                    "policeBar"
                ).style.width =
                    data.police + "%";

            } else {

                document.getElementById(
                    "population"
                ).innerText =
                    "Unknown";

                document.getElementById(
                    "marketBar"
                ).style.width =
                    "50%";

                document.getElementById(
                    "demandBar"
                ).style.width =
                    "50%";

                document.getElementById(
                    "policeBar"
                ).style.width =
                    "50%";

            }


            const button =
                document.getElementById(
                    "startButton"
                );


            if (
                ownedCountries.has(country)
            ) {

                document.getElementById(
                    "startMessage"
                ).innerText =
                    "🏴 You control this country.";

                button.innerText =
                    "CONTROLLED";

                button.disabled = true;

            }

            else if (!gameStarted) {

                document.getElementById(
                    "startMessage"
                ).innerText =
                    "Choose this country as your starting location.";

                button.innerText =
                    "START EMPIRE HERE";

                button.disabled = false;

            }

            else {

                document.getElementById(
                    "startMessage"
                ).innerText =
                    "This country is not controlled.";

                button.innerText =
                    "EXPANSION COMING SOON";

                button.disabled = true;

            }

        }


        function startEmpire() {

            if (!selectedCountry) {
                return;
            }

            if (gameStarted) {
                return;
            }

            gameStarted = true;

            startingCountry =
                selectedCountry;

            ownedCountries.add(
                selectedCountry
            );


            if (selectedElement) {

                selectedElement.classList.add(
                    "owned"
                );

            }


            document.getElementById(
                "startMessage"
            ).innerText =
                "🏴 Your empire starts here!";


            document.getElementById(
                "startButton"
            ).innerText =
                "YOUR CAPITAL";


            document.getElementById(
                "startButton"
            ).disabled = true;


            document.getElementById(
                "instruction"
            ).innerText =
                "🌍 Your empire has begun!";


            saveGame();

        }

    </script>

</body>
</html>
